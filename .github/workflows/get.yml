name: Get Linux sfp.c

on:
  workflow_dispatch:

jobs:
  get:
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux 6.12.87
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.87.tar.xz
          tar -xf linux-6.12.87.tar.xz

      - name: Upload sfp.c
        uses: actions/upload-artifact@v4
        with:
          name: sfp
          path: linux-6.12.87/drivers/net/phy/sfp.c
