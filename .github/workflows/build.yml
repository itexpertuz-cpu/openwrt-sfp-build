name: Prepare OpenWrt Kernel

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget ccache

      - name: Clone OpenWrt
        run: |
          git clone --branch v25.12.4 --depth 1 https://github.com/openwrt/openwrt.git

      - name: Configure target
        working-directory: openwrt
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r3=y
          EOF

          make defconfig

      - name: Prepare kernel
        working-directory: openwrt
        run: |
          make target/linux/prepare -j$(nproc) V=s

      - name: Find sfp.c
        run: |
          find openwrt -path "*/drivers/net/phy/sfp.c" -print

      - name: Upload kernel tree
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tree
          path: |
            openwrt/build_dir/**/linux-*/drivers/net/phy/sfp.c
