name: Find sfp.c

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd wget

      - name: Download SDK
        run: |
          wget -q https://downloads.openwrt.org/releases/25.12.4/targets/mediatek/filogic/openwrt-sdk-25.12.4-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst

      - name: Extract SDK
        run: |
          tar --zstd -xf openwrt-sdk-25.12.4-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst

      - name: Find sfp.c
        run: |
          SDK=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*")
          cd "$SDK"

          echo "===== SEARCH sfp.c ====="
          find build_dir -name sfp.c

          echo
          echo "===== SEARCH sfp.ko ====="
          find build_dir -name sfp.ko

          echo
          echo "===== DIRECTORY ====="
          find build_dir -path "*drivers/net/phy*" -type d

      - name: Upload sfp.c
        uses: actions/upload-artifact@v4
        with:
          name: sfp-source
          path: |
            openwrt-sdk-*/build_dir/**/drivers/net/phy/sfp.c
