name: OpenWrt Prepare Build

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          swig \
          unzip \
          wget \
          zlib1g-dev \
          file \
          time \
          ccache

    - name: Clone OpenWrt
      run: |
        git clone --depth=1 --branch openwrt-25.12 https://git.openwrt.org/openwrt/openwrt.git

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Configure target
      run: |
        cd openwrt

        cat > .config <<'EOF'
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r3=y
        EOF

        make defconfig

    - name: Prepare toolchain
      run: |
        cd openwrt
        make tools/install -j$(nproc)

    - name: Prepare toolchain 2
      run: |
        cd openwrt
        make toolchain/install -j$(nproc)

    - name: Prepare kernel
      run: |
        cd openwrt
        make target/linux/prepare V=s

    - name: Verify kernel tree
      run: |
        cd openwrt

        echo "=========="

        find build_dir -name sfp.c

        echo "=========="

        find build_dir -name sfp.ko

        echo "=========="

        ls build_dir/*/linux-*/linux-*/drivers/net/phy/

    - name: Upload kernel tree
      uses: actions/upload-artifact@v4
      with:
        name: kernel-tree
        path: openwrt/build_dir
